name: Daily LinkedIn Poster

on:
  schedule:
    - cron: '30 4 * * *' # Runs at 4:30 AM UTC (10:00 AM IST)
  workflow_dispatch: # Allows manual testing

jobs:
  post-to-linkedin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4  # <-- Updated from v3 to v4

      - name: Set up Python
        uses: actions/setup-python@v5 # <-- Updated from v4 to v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Python Script
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_URN: ${{ secrets.LINKEDIN_URN }}
        run: python main.py
